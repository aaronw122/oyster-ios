name: Oyster
options:
  bundleIdPrefix: com.aaronw122
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  OysterKit:
    path: OysterKit

targets:
  Oyster:
    type: application
    platform: iOS
    sources:
      - path: Oyster
    dependencies:
      - package: OysterKit
        product: OysterKit
      - target: OysterWidget
        embed: true
        codeSign: false
    entitlements:
      path: Oyster/Oyster.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aaronw122.oyster
    info:
      path: Oyster/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.aaronw122.oyster
            CFBundleURLSchemes:
              - oyster
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaronw122.oyster
        PRODUCT_NAME: Oyster
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oyster
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"

  OysterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OysterTests
    dependencies:
      - target: Oyster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaronw122.oyster.tests
        GENERATE_INFOPLIST_FILE: YES

  OysterWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: OysterWidget
    dependencies:
      - package: OysterKit
        product: OysterKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: OysterWidget/OysterWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aaronw122.oyster
    info:
      path: OysterWidget/Info.plist
      properties:
        CFBundleDisplayName: Oyster
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaronw122.oyster.widget
        PRODUCT_NAME: OysterWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

schemes:
  Oyster:
    build:
      targets:
        Oyster: all
        OysterWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OysterTests
    archive:
      config: Release
  OysterKit:
    build:
      targets:
        Oyster: [test]
    test:
      config: Debug
      targets:
        - package: OysterKit/OysterKitTests
